name: Build Static zrok Binaries

# Triggers:
#   1. When openziti/zrok publishes a new release (via repository_dispatch
#      sent by the watch workflow below, or manually via workflow_dispatch)
#   2. Manually from the Actions tab for testing
on:
  repository_dispatch:
    types: [zrok_release]
  workflow_dispatch:
    inputs:
      zrok_version:
        description: "zrok version to build (e.g. 1.1.11). Leave blank for latest."
        required: false
        default: ""

jobs:
  # ── Resolve the version to build ──────────────────────────────────────────
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Determine zrok version
        id: version
        run: |
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            # Triggered by watch workflow
            RAW="${{ github.event.client_payload.version }}"
          elif [ -n "${{ github.event.inputs.zrok_version }}" ]; then
            # Manual override
            RAW="${{ github.event.inputs.zrok_version }}"
          else
            # Fetch latest from GitHub API
            RAW=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/openziti/zrok/releases/latest \
              | jq -r '.tag_name')
          fi
          # Strip leading 'v'
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "Building zrok version: ${VERSION}"

  # ── Build static binary for each architecture ──────────────────────────────
  build:
    needs: resolve-version
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            musl_target: x86_64-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            goarch: arm64
            musl_target: aarch64-linux-musl
            runner: ubuntu-latest
          - arch: armv7
            goarch: arm
            goarm: "7"
            musl_target: arm-linux-musleabihf
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    env:
      ZROK_VERSION: ${{ needs.resolve-version.outputs.version }}
      ZROK_TAG:     ${{ needs.resolve-version.outputs.tag }}

    steps:
      - name: Checkout openziti/zrok at tag
        uses: actions/checkout@v4
        with:
          repository: openziti/zrok
          ref: ${{ env.ZROK_TAG }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js (required to build embedded UI assets)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            agent/agentUi/package-lock.json

      - name: Build UI assets
        run: |
          (cd ui && npm ci && npm run build)
          (cd agent/agentUi && npm ci && npm run build)

      - name: Install musl cross-compiler (${{ matrix.musl_target }})
        run: |
          sudo apt-get update -q
          # musl-tools covers native amd64; cross compilers need separate packages
          sudo apt-get install -y musl-tools

          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            # musl's <unistd.h> never declares pread64/pwrite64 or off64_t.
            # go-sqlite3 hard-codes -DHAVE_PREAD64=1 in its "#cgo linux CFLAGS:"
            # which Go appends AFTER CGO_CFLAGS, so env-var -D overrides cannot
            # win. Appending -D flags after "$@" also fails because GCC may ignore
            # -D flags that appear after the -o <file> argument.
            #
            # The reliable fix: a force-included header that uses #undef to patch
            # the macros. GCC always processes -include files AFTER all command-line
            # -D defines are established, so #undef inside them wins.
            sudo tee /usr/local/bin/musl-gcc > /dev/null << 'SH'
          #!/bin/sh
          # musl's <unistd.h> does not expose pread64/pwrite64/off64_t by default.
          # go-sqlite3 compiles them via HAVE_PREAD64=1 (set in its #cgo linux CFLAGS).
          # Map them to musl equivalents using object-like macros; these are symbol
          # substitutions and cannot be overridden by HAVE_PREAD64 feature flags.
          # On 64-bit musl off_t is already 64-bit, so pread==pread64 semantically.
          exec /usr/bin/musl-gcc \
            -Dpread64=pread \
            -Dpwrite64=pwrite \
            -Doff64_t=off_t \
            "$@"
          SH
            sudo chmod +x /usr/local/bin/musl-gcc
          fi

          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            # aarch64 musl cross toolchain (libc6-dev-arm64-cross provides sysroot headers)
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            # Wrap with musl static flags via a shim
            sudo tee /usr/local/bin/aarch64-musl-gcc > /dev/null << 'SH'
          #!/bin/sh
          exec aarch64-linux-gnu-gcc \
            --sysroot=/usr/aarch64-linux-gnu \
            -static \
            -D_GNU_SOURCE \
            "$@"
          SH
            sudo chmod +x /usr/local/bin/aarch64-musl-gcc
          fi

          if [ "${{ matrix.goarch }}" = "arm" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
            sudo tee /usr/local/bin/armhf-musl-gcc > /dev/null << 'SH'
          #!/bin/sh
          exec arm-linux-gnueabihf-gcc \
            --sysroot=/usr/arm-linux-gnueabihf \
            -static \
            -D_GNU_SOURCE \
            "$@"
          SH
            sudo chmod +x /usr/local/bin/armhf-musl-gcc
          fi

      - name: Verify compiler shim
        run: |
          echo "=== CC wrapper ===" && cat "$(which "${{ matrix.goarch == 'amd64' && 'musl-gcc' || matrix.goarch == 'arm64' && 'aarch64-musl-gcc' || 'armhf-musl-gcc' }}")"
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            echo "=== sqlite3_musl_fix.h ===" && cat /usr/local/include/sqlite3_musl_fix.h
          fi

      - name: Build static zrok binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM:  ${{ matrix.goarm || '' }}
          CGO_ENABLED: "1"
          # Select the correct musl-wrapping C compiler per arch
          CC: >-
            ${{
              matrix.goarch == 'amd64' && 'musl-gcc' ||
              matrix.goarch == 'arm64' && 'aarch64-musl-gcc' ||
              'armhf-musl-gcc'
            }}
        run: |
          mkdir -p dist
          go build \
            -tags netgo,osusergo \
            -ldflags "-linkmode external -extldflags '-static' \
                      -X github.com/openziti/zrok/build.Version=${ZROK_VERSION} \
                      -X github.com/openziti/zrok/build.Hash=$(git rev-parse --short HEAD)" \
            -o dist/zrok \
            ./cmd/zrok

      - name: Verify binary is statically linked
        run: |
          file dist/zrok
          # readelf -d reads ELF headers directly; works for any target arch.
          # A static binary has no NEEDED entries in its dynamic section.
          if readelf -d dist/zrok 2>/dev/null | grep -q NEEDED; then
            echo "❌ Binary is NOT statically linked!"
            readelf -d dist/zrok | grep NEEDED
            exit 1
          else
            echo "✅ Binary is statically linked"
          fi

      - name: Package into tarball
        run: |
          TARBALL="zrok_${ZROK_VERSION}_linux_${{ matrix.arch }}_static.tar.gz"
          tar -czf "${TARBALL}" -C dist zrok
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrok-static-${{ matrix.arch }}-${{ env.ZROK_VERSION }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          retention-days: 90

  # ── Create a GitHub release on ha-zrok with all binaries attached ──────────
  release:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ZROK_VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "zrok-static-v${{ env.ZROK_VERSION }}"
          name: "Static zrok v${{ env.ZROK_VERSION }} for Alpine/HAOS"
          body: |
            Statically linked zrok v${{ env.ZROK_VERSION }} binaries for use in
            musl-based environments (Alpine Linux, Home Assistant OS/Container).

            Built from [openziti/zrok@${{ needs.resolve-version.outputs.tag }}](https://github.com/openziti/zrok/releases/tag/${{ needs.resolve-version.outputs.tag }})

            ## Architectures
            | File | Platform |
            |------|----------|
            | `zrok_*_linux_amd64_static.tar.gz`  | x86-64 (most NUC/VM installs) |
            | `zrok_*_linux_arm64_static.tar.gz`  | ARM 64-bit (Pi 4/5 64-bit OS) |
            | `zrok_*_linux_armv7_static.tar.gz`  | ARM 32-bit (Pi 3/4 32-bit OS) |

            ## Verification
            Each tarball has a companion `.sha256` checksum file.
          files: artifacts/**
          fail_on_unmatched_files: true